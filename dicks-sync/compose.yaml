# Dick's sell-through lego: downloads Dick's weekly Item Performance report from the SPS Commerce
# portal each day and loads it into ext.DicksSellThrough in Spirit Web DB for Metabase.
# Design: docs/specs/2026-10-05-dicks-sell-through-design.md

services:
  dicks-sync:
    build:
      context: .
    image: dicks-sync:local
    container_name: dicks-sync
    restart: unless-stopped
    environment:
      SPS_EMAIL: ${SPS_EMAIL}
      SPS_PASSWORD: ${SPS_PASSWORD}
      SQL_SERVER: ${SQL_SERVER}
      SQL_DATABASE: ${SQL_DATABASE}
      SQL_USER: ${SQL_USER}
      SQL_PASSWORD: ${SQL_PASSWORD}
      SYNC_CRON: ${SYNC_CRON:-0 6 * * *}
      # Not ${TZ}: the root .env sets TZ for the whole stack and would win over this lego's .env.
      TZ: ${DICKS_SYNC_TZ:-America/Denver}
    volumes:
      - dicks-sync-data:/data
    networks:
      - edge
    logging:
      driver: local

volumes:
  dicks-sync-data:

networks:
  edge:
    name: edge
    external: true
